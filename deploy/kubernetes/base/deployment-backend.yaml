apiVersion: apps/v1
kind: Deployment
metadata:
  name: inox-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inox-backend
  template:
    metadata:
      labels:
        app: inox-backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - inox-backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        image: inox-backend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: inox-config
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
