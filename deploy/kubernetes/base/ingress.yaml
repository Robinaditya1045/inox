apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inox-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "inox-backend-svc"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - inox.example.com
    secretName: inox-tls
  rules:
  - host: inox.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: inox-backend-svc
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inox-frontend-svc
            port:
              number: 80
